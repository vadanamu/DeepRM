version: 2
build:
  os: ubuntu-24.04
  tools:
    python: "3.11"
  jobs:
    post_checkout:
      # the example data (about 1.5 GB) is not used by the docs; removing it keeps the build within the disk limit
      - rm -rf example
    pre_install:
      # torch is a dependency of DeepRM; the CPU build is enough for the docs and avoids a ~3 GB CUDA download
      - python -m pip install "torch==2.10.0" --index-url https://download.pytorch.org/whl/cpu
python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
sphinx:
  configuration: docs/source/conf.py
