name: CI

on:
  push:
    branches:
      - public
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Free up space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Install project and tools
        run: |
          python -m pip install -U pip
          # CPU PyTorch first (the model tests run on CPU); pip keeps it when it installs DeepRM, which pins
          # torch==2.10.0 (2.10.0+cpu meets that pin)
          python -m pip install "torch==2.10.0" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .[docs,test,train]  # docs, test and training (torchmetrics) extras

      - name: Smoke the CLI
        run: |
          python -m deeprm --help
          python -m deeprm call --help

      - name: Run tests
        run: pytest -q -rs

      - name: Build docs
        run: |
          python -m sphinx docs/source docs/build/html -W
